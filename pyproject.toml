version = "0.1.0"
description = "Extrae la documentación de IBM OpenPages 9.1.3 en español a Markdown verificable."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
openpages = "openpages.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
